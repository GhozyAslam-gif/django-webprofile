{% extends 'base.html' %}

{% block title %}
   Form Siswa
{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold text-slate-900">
        Form Siswa
    </h1>    
    <p class="text-gray-600">Halaman form siswa kelas X - HSI Boarding School Purworejo</p>
    <hr class="border-t border-slate-200 my-2" />

    <form method="post" class="space-y-5">
        <!-- token keamanan anti-CSRF -->
        {% csrf_token %}

        <!-- form inputannya disini ntar -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
            <input type="text" name="nama" value="{{ siswa.nama|default:'' }}" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Umur</label>
            <input type="number" name="umur" value="{{ siswa.umur|default:'' }}" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
            <input type="date" name="tgl_lahir" value="{{ siswa.tgl_lahir|date:'Y-m-d'|default:'' }}" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Status Hadir</label>
    <div class="flex gap-5 items-center">
        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
            <input type="radio" name="status_hadir" value="Hadir" 
                   {% if siswa.status_hadir == "Hadir" %}checked{% endif %} required
                   class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
            Hadir
        </label>

        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
            <input type="radio" name="status_hadir" value="Tidak Hadir" 
                   {% if siswa.status_hadir == "Tidak Hadir" %}checked{% endif %}
                   class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
            Tidak Hadir
        </label>
    </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nilai Akhir</label>
            <input type="number" name="nilai_akhir" value="{{ siswa.nilai_akhir|default:'' }}" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
                Update Data
            </button>

            <a href="{% url 'siswa_list' %}"
            class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-200">
                Batal
            </a>
        </div>
    </form>
{% endblock %}
